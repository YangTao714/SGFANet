name: train_SGFANet_x3
model_type: SGFANetModel
scale: 3
num_gpu: auto
manual_seed: 3407

datasets:
  train:
    task: SR
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: datasets/DIV2K/DIV2K_HR
    dataroot_lq: datasets/DIV2K/DIV2K_LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

    gt_size: 192
    use_hflip: true
    use_rot: true

    # ========= 超像素相关（统一配置）=========
    use_superpixels: true
    sp_cfg:
      avg_size: 10
      max_sp: 50
      adaptive_max_sp: true
      top_n: 3
      ref_patch_size: 64
      area_pow: 1.0
      compactness: 11
      sigma: 1.0
      enforce_connectivity: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 100
    prefetch_mode: 'cuda'
    pin_memory: true

  val_0:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/Set5/HR
    dataroot_lq: datasets/Set5/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_1:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/Set14/HR
    dataroot_lq: datasets/Set14/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_2: # the 3rd test dataset
    name: B100
    type: PairedImageDataset
    dataroot_gt: datasets/B100/HR
    dataroot_lq: datasets/B100/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

  val_3: # the 4th test dataset
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: datasets/Urban100/HR
    dataroot_lq: datasets/Urban100/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk


  val_4: # the 5th test dataset
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: datasets/Manga109/HR
    dataroot_lq: datasets/Manga109/LR_bicubic/X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk


# network structures
network_g:
  type: SGFANet
  upscale: 3

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [ 0.9, 0.99 ]

  scheduler:
    type: MultiStepLR
    milestones: [ 300000, 500000, 650000, 700000, 750000 ]
    gamma: 0.5
  total_iter: 800000

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean



val:
  val_freq: !!float 2500
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr_pt
      crop_border: 3
      test_y_channel: true

    ssim:
      type: calculate_ssim_pt
      crop_border: 3
      test_y_channel: true

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
